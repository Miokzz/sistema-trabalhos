<style>

.brand{display:flex;align-items:center;gap:11px;text-decoration:none}.brand-badge{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:Manrope;font-weight:800;letter-spacing:-.04em;background:linear-gradient(145deg,#fff,#a5eeff);color:#081120;box-shadow:0 0 25px rgba(110,231,255,.14)}.brand div{display:grid;line-height:1}.brand strong{font-size:.69rem;letter-spacing:.15em;color:var(--cyan)}.brand span{margin-top:5px;font-weight:700;font-size:.9rem}

.network{position:relative;width:min(100%,660px);aspect-ratio:1.18;margin:auto;border:1px solid var(--line);border-radius:34px;background:radial-gradient(circle at 50% 48%,rgba(86,214,255,.09),transparent 30%),linear-gradient(180deg,rgba(12,23,42,.76),rgba(6,13,25,.94));box-shadow:0 32px 90px rgba(0,0,0,.27);overflow:hidden}.network:before,.network:after{content:"";position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.055);border-radius:50%;animation:orbit 18s linear infinite}.network:before{width:58%;height:58%}.network:after{width:82%;height:82%;animation-direction:reverse;animation-duration:26s}@keyframes orbit{to{transform:translate(-50%,-50%) rotate(360deg)}}.core,.node{position:absolute;border-radius:50%;display:grid;place-items:center;align-content:center;text-align:center;z-index:3;border:1px solid var(--line);background:rgba(8,17,31,.93);box-shadow:0 20px 55px rgba(0,0,0,.28)}.core{left:50%;top:49%;transform:translate(-50%,-50%);width:150px;height:150px;background:radial-gradient(circle at 35% 25%,rgba(110,231,255,.28),rgba(8,17,31,.95) 67%)}.core svg{width:40px;color:var(--cyan)}.core strong{font-size:.88rem;margin-top:4px}.core small{color:var(--muted);font-size:.64rem}.node{width:122px;height:122px;gap:7px}.node svg{width:30px;height:30px}.node b{font-size:.76rem}.n1{left:50%;top:5%;transform:translateX(-50%);color:var(--green)}.n2{left:7%;bottom:7%;color:var(--gold)}.n3{right:7%;bottom:7%;color:var(--violet)}.network svg.links{position:absolute;inset:0;width:100%;height:100%;z-index:1}.network svg.links path{fill:none;stroke:rgba(130,198,255,.26);stroke-width:1.7;stroke-dasharray:6 10;animation:dash 12s linear infinite}@keyframes dash{to{stroke-dashoffset:-160}}
.timeline{position:relative;display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:17px;overflow-x:auto;padding:28px 3px 20px}.timeline:before{content:"";position:absolute;left:20px;right:20px;top:66px;height:1px;background:linear-gradient(90deg,transparent,rgba(110,231,255,.3),rgba(159,130,255,.3),transparent)}.time{position:relative;min-height:305px;padding:29px 19px 21px;border:1px solid var(--line);border-radius:23px;background:linear-gradient(180deg,rgba(12,23,42,.82),rgba(6,13,25,.94));box-shadow:0 20px 55px rgba(0,0,0,.2)}.time:before{content:"";position:absolute;left:22px;top:-11px;width:22px;height:22px;border-radius:50%;background:#07111f;border:1px solid rgba(110,231,255,.35)}.time:after{content:"";position:absolute;left:29px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 16px var(--cyan)}.time .year{display:inline-block;margin-top:7px;color:var(--cyan);font-weight:800;letter-spacing:.07em}.time h3{font-size:1.16rem;margin:19px 0 11px}.time p{margin:0;color:var(--muted);line-height:1.65;font-size:.88rem}
.problem{padding:52px;border:1px solid var(--line);border-radius:35px;background:radial-gradient(circle at 10% 4%,rgba(255,120,143,.08),transparent 25%),radial-gradient(circle at 92% 92%,rgba(87,242,161,.08),transparent 27%),linear-gradient(160deg,rgba(12,23,42,.88),rgba(6,12,23,.97));box-shadow:0 38px 100px rgba(0,0,0,.31)}.problem .help{color:var(--cyan);width:55px;height:55px}.problem-kicker{display:block;margin-top:17px;color:var(--muted);font-size:.69rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800}.problem h2{font-family:Manrope;font-size:clamp(2.4rem,5vw,5.25rem);line-height:.98;letter-spacing:-.055em;max-width:1080px;margin:14px 0 39px}.problem h2 em{font-style:normal;color:#ff94a8}.answers{display:grid;grid-template-columns:1fr 1fr;gap:15px}.answer{padding:24px;border:1px solid var(--soft);border-radius:21px;background:rgba(255,255,255,.023)}.answer>span{font-size:.66rem;letter-spacing:.12em;font-weight:800}.answer.bad span{color:#ff91a5}.answer.good span{color:#65f4aa}.answer h3{font-size:1.48rem;margin:8px 0 9px}.answer p{margin:0;color:var(--muted);line-height:1.64}.thesis{display:grid;grid-template-columns:auto 1fr;gap:15px;align-items:start;margin-top:17px;padding:21px;border-radius:21px;border:1px solid rgba(110,231,255,.13);background:rgba(110,231,255,.04)}.thesis svg{width:24px;color:var(--cyan)}.thesis p{margin:0;color:#dce5f5;line-height:1.68}
.quiz{border:1px solid var(--line);border-radius:31px;background:linear-gradient(180deg,rgba(12,23,42,.84),rgba(6,13,25,.96));box-shadow:0 32px 90px rgba(0,0,0,.27);overflow:hidden}.quiz-head{display:flex;justify-content:space-between;padding:15px 19px;border-bottom:1px solid var(--soft);font-size:.68rem;letter-spacing:.11em;color:var(--muted)}.quiz-head b{color:var(--cyan)}.quiz-body{padding:36px}.quiz-body h3{font-family:Manrope;font-size:clamp(1.55rem,3vw,2.6rem);letter-spacing:-.035em;max-width:850px;margin:0 0 26px}.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.opt{display:flex;gap:11px;align-items:center;text-align:left;padding:16px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.022);color:#dbe5f4;cursor:pointer;transition:.2s}.opt:hover{transform:translateY(-3px);background:rgba(255,255,255,.045)}.opt span{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.055);font-size:.7rem;font-weight:800}.opt.correct{border-color:rgba(87,242,161,.4);background:rgba(87,242,161,.08)}.opt.wrong{border-color:rgba(255,120,143,.4);background:rgba(255,120,143,.08)}.opt.dim{opacity:.35}.result{min-height:310px;display:grid;place-items:center;align-content:center;text-align:center;padding:38px}.result svg{color:var(--gold);width:42px;height:42px}.result h3{font-size:3.8rem;margin:10px 0 3px}.result p{color:var(--muted);max-width:550px}.result button{margin-top:12px;padding:11px 15px;border-radius:13px;cursor:pointer;background:linear-gradient(135deg,#d8f8ff,#71e2ff);color:#07111f;font-weight:800}
.sources{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.source{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:15px;padding:16px 17px;border:1px solid var(--soft);border-radius:17px;background:rgba(255,255,255,.022);text-decoration:none;transition:.2s}.source:hover{transform:translateY(-3px);border-color:rgba(110,231,255,.2);background:rgba(110,231,255,.04)}.source span{font-size:.66rem;color:var(--cyan);font-weight:800;letter-spacing:.09em}.source strong{font-size:.88rem}.source svg{width:17px;color:#77849c}.credits{margin-top:45px;padding:23px;border-top:1px solid var(--soft);display:flex;gap:16px;align-items:center}.cej-mark{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#b8f2ff);color:#081120;font-family:Manrope;font-size:1.2rem;font-weight:800}.credits div{display:grid;gap:4px}.credits span{font-size:.65rem;letter-spacing:.12em;color:var(--cyan);font-weight:800}.credits strong{font-size:1rem}.credits small{color:var(--muted)}

.present-controls{position:fixed;right:20px;bottom:20px;z-index:1500;display:flex;align-items:center;gap:7px;padding:8px;border:1px solid var(--line);border-radius:17px;background:rgba(4,9,17,.84);backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.35)}.present-controls button{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.05);color:white;cursor:pointer}.present-controls span{min-width:52px;text-align:center;color:var(--muted);font-size:.73rem}.presentation .topbar{opacity:.08;pointer-events:none}.presentation .section{min-height:100svh;display:flex;flex-direction:column;justify-content:center}

const powers=[{id:"executivo",n:"01",name:"Executivo",role:"Governa e administra",color:"#57f2a1",summary:"Executa as leis, administra o Estado e transforma decisões políticas em ações, serviços e políticas públicas.",items:["Na União, é exercido pelo Presidente da República e seus ministros.","Nos estados, o chefe do Executivo é o governador.","Nos municípios, o chefe do Executivo é o prefeito.","Pode propor projetos, sancionar ou vetar leis e administrar o orçamento dentro das regras legais."],phrase:"Decisão vira ação."},{id:"legislativo",n:"02",name:"Legislativo",role:"Representa, legisla e fiscaliza",color:"#ffd05b",summary:"Cria e debate leis, fiscaliza o Poder Executivo e representa a sociedade e os entes da Federação.",items:["Na União, o Congresso Nacional é formado pela Câmara dos Deputados e pelo Senado Federal.","Nos estados, a função é exercida pelas Assembleias Legislativas.","Nos municípios, pelas Câmaras de Vereadores.","Também analisa orçamento, fiscaliza gastos e participa de mecanismos de controle político."],phrase:"Voz vira regra."},{id:"judiciario",n:"03",name:"Judiciário",role:"Julga e garante direitos",color:"#9f82ff",summary:"Resolve conflitos, interpreta e aplica as leis e protege a Constituição e os direitos fundamentais.",items:["É formado por tribunais e juízes em diferentes ramos e instâncias.","O Supremo Tribunal Federal é o guardião da Constituição Federal.","Pode controlar a constitucionalidade de leis e atos do poder público.","Não existe um Poder Judiciário municipal próprio."],phrase:"Conflito vira decisão."}];

function ThreeHero(){const mount=useRef(null);useEffect(()=>{const el=mount.current;if(!el)return;const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x050914,.035);const cam=new THREE.PerspectiveCamera(46,el.clientWidth/el.clientHeight,.1,100);cam.position.set(0,1.25,8.4);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(el.clientWidth,el.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;el.appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0x93a9c9,.6));const dl=new THREE.DirectionalLight(0xe8f8ff,3);dl.position.set(4,7,5);scene.add(dl);const p1=new THREE.PointLight(0x4fd8ff,40,16);p1.position.set(-4,2,4);scene.add(p1);const p2=new THREE.PointLight(0x9f82ff,34,14);p2.position.set(4,-1,4);scene.add(p2);const p3=new THREE.PointLight(0xffd05b,24,13);p3.position.set(0,5,-3);scene.add(p3);const group=new THREE.Group();scene.add(group);const coreGeo=new THREE.IcosahedronGeometry(1.2,4);const coreMat=new THREE.MeshPhysicalMaterial({color:0x8de8ff,roughness:.1,metalness:.42,clearcoat:1,emissive:0x4fd8ff,emissiveIntensity:.28});const core=new THREE.Mesh(coreGeo,coreMat);group.add(core);const torusMat=(c,o=.38)=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o});const r1=new THREE.Mesh(new THREE.TorusGeometry(1.65,.018,8,120),torusMat(0xffffff,.22));r1.rotation.x=Math.PI/2;group.add(r1);const r2=new THREE.Mesh(new THREE.TorusGeometry(2.1,.014,8,120),torusMat(0x7790ff,.28));r2.rotation.set(.55,.1,.6);group.add(r2);const data=[[-2.65,-.22,.5,0x57f2a1,2.8],[2.65,-.15,.5,0xffd05b,3.1],[0,-1,2.35,0x9f82ff,2.45]];const pillars=data.map(([x,y,z,c,h],idx)=>{const g=new THREE.Group();g.position.set(x,y,z);const box=new THREE.Mesh(new THREE.BoxGeometry(1.12,h,1.12),new THREE.MeshPhysicalMaterial({color:c,roughness:.17,metalness:.6,clearcoat:1,emissive:c,emissiveIntensity:.12}));g.add(box);const cap=new THREE.Mesh(new THREE.CylinderGeometry(.66,.66,.15,6),new THREE.MeshStandardMaterial({color:0xdce7ff,metalness:.72,roughness:.24}));cap.position.y=h/2+.14;g.add(cap);const ring=new THREE.Mesh(new THREE.TorusGeometry(.88,.014,7,80),torusMat(c,.55));ring.rotation.x=Math.PI/2;g.add(ring);g.userData={baseY:y,idx,ring};group.add(g);return g});const sg=new THREE.BufferGeometry(),count=520,arr=new Float32Array(count*3);for(let i=0;i<count;i++){arr[i*3]=(Math.random()-.5)*30;arr[i*3+1]=(Math.random()-.5)*18;arr[i*3+2]=(Math.random()-.5)*28}sg.setAttribute("position",new THREE.BufferAttribute(arr,3));const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xbde9ff,size:.035,transparent:true,opacity:.58}));scene.add(stars);let mx=0,my=0;const move=e=>{const r=el.getBoundingClientRect();mx=((e.clientX-r.left)/r.width-.5)*2;my=((e.clientY-r.top)/r.height-.5)*2};el.addEventListener("pointermove",move);const clock=new THREE.Clock();let raf;const loop=()=>{const t=clock.getElapsedTime();core.rotation.x+=.0016;core.rotation.y+=.0025;core.scale.setScalar(1+Math.sin(t*1.6)*.024);r1.rotation.z+=.0018;r2.rotation.z-=.0011;pillars.forEach((g,i)=>{g.position.y=g.userData.baseY+Math.sin(t*.8+i)*.075;g.rotation.y+=.002;g.userData.ring.rotation.z-=.004});group.rotation.y+=(mx*.2-group.rotation.y)*.035;group.rotation.x+=(-my*.11-group.rotation.x)*.035;stars.rotation.y+=.00022;renderer.render(scene,cam);raf=requestAnimationFrame(loop)};loop();const resize=()=>{cam.aspect=el.clientWidth/el.clientHeight;cam.updateProjectionMatrix();renderer.setSize(el.clientWidth,el.clientHeight)};addEventListener("resize",resize);return()=>{cancelAnimationFrame(raf);removeEventListener("resize",resize);el.removeEventListener("pointermove",move);renderer.dispose();el.innerHTML=""}},[]);return html`<div ref=${mount} style=${{width:"100%",height:"100%"}}></div>`}
function Label({n,children}){return html`<div className="section-label"><span>${String(n).padStart(2,"0")}</span><i></i><b>${children}</b></div>`}
function Reveal({children,className=""}){const r=useRef(null);useEffect(()=>{const el=r.current;if(!el)return;const io=new IntersectionObserver(([e])=>{if(e.isIntersecting){el.classList.add("visible");io.disconnect()}},{threshold:.14});io.observe(el);return()=>io.disconnect()},[]);return html`<div ref=${r} className=${"reveal "+className}>${children}</div>`}
function IconFor({id}){const C=id==="executivo"?Building2:id==="legislativo"?Landmark:Scale;return html`<${C}/>`}
function Quiz(){const qs=[["Quem administra o país e executa políticas públicas?",["Legislativo","Executivo","Judiciário"],1],["Quem cria leis e fiscaliza o Executivo?",["Legislativo","Executivo","Judiciário"],0],["Quem protege a Constituição e julga conflitos?",["Executivo","Legislativo","Judiciário"],2],["Por que os poderes são separados?",["Para concentrar decisões","Para evitar abusos e criar equilíbrio","Para eliminar eleições"],1]];const[i,setI]=useState(0),[sel,setSel]=useState(null),[score,setScore]=useState(0),done=i>=qs.length;const choose=j=>{if(sel!==null)return;setSel(j);if(j===qs[i][2])setScore(s=>s+1);setTimeout(()=>{setSel(null);setI(v=>v+1)},760)};return html`<div className="quiz"><div className="quiz-head"><span>QUIZ DA TURMA</span><b>${done?"FIM":(i+1)+" / "+qs.length}</b></div><${AnimatePresence} mode="wait">${!done?html`<${motion.div} key=${i} className="quiz-body" initial=${{opacity:0,x:24}} animate=${{opacity:1,x:0}} exit=${{opacity:0,x:-24}}><h3>${qs[i][0]}</h3><div className="opts">${qs[i][1].map((o,j)=>{let c="opt";if(sel!==null)c+=" "+(j===sel?(j===qs[i][2]?"correct":"wrong"):(j===qs[i][2]?"correct":"dim"));return html`<button className=${c} onClick=${()=>choose(j)}><span>${String.fromCharCode(65+j)}</span>${o}</button>`})}</div></${motion.div}>`:html`<${motion.div} key="done" className="result" initial=${{opacity:0,scale:.95}} animate=${{opacity:1,scale:1}}><${Sparkles}/><h3>${score}/${qs.length}</h3><p>${score===qs.length?"Gabaritou. A democracia sobreviveu ao teste.":"Boa. Agora a turma já sabe onde cada poder entra em cena."}</p><button onClick=${()=>{setI(0);setScore(0);setSel(null)}}>Refazer quiz</button></${motion.div}>`}</${AnimatePresence}></div>`}
function App(){const[active,setActive]=useState(0),[presenting,setPresenting]=useState(false),[pi,setPi]=useState(0);const{scrollYProgress}=useScroll(),progress=useSpring(scrollYProgress,{stiffness:120,damping:30}),p=powers[active],halo=useRef(null);useEffect(()=>{const lenis=new Lenis({duration:1.05,smoothWheel:true});let raf;const f=t=>{lenis.raf(t);raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f);return()=>{cancelAnimationFrame(raf);lenis.destroy()}},[]);useEffect(()=>{const m=e=>halo.current?.animate({transform:"translate3d("+(e.clientX-190)+"px,"+(e.clientY-190)+"px,0)"},{duration:500,fill:"forwards"});addEventListener("pointermove",m);return()=>removeEventListener("pointermove",m)},[]);const go=d=>{const n=Math.max(0,Math.min(sections.length-1,pi+d));setPi(n);document.getElementById(sections[n])?.scrollIntoView({behavior:"smooth"})};useEffect(()=>{if(!presenting)return;const k=e=>{if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){e.preventDefault();go(1)}if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){e.preventDefault();go(-1)}if(e.key==="Escape")setPresenting(false)};addEventListener("keydown",k);return()=>removeEventListener("keydown",k)});const start=async()=>{setPresenting(true);setPi(0);document.getElementById("inicio")?.scrollIntoView();try{await document.documentElement.requestFullscreen?.()}catch{}};const stop=async()=>{setPresenting(false);try{if(document.fullscreenElement)await document.exitFullscreen()}catch{}};return html`<div className=${presenting?"presentation":""}><div className="grid-bg"></div><div ref=${halo} className="halo"></div><${motion.div} className="progress" style=${{scaleX:progress}}/><header className="topbar"><a className="brand" href="#inicio"><div className="brand-badge">CEJ</div><div><strong>HISTÓRIA</strong><span>Os Três Poderes</span></div></a><nav><a href="#poderes">Poderes</a><a href="#equilibrio">Equilíbrio</a><a href="#historia">História</a><a href="#problema">Questão</a><button className="present" onClick=${start}><${Maximize2} size=${15}/> Apresentar</button></nav></header><main>
<section id="inicio" className="hero"><div className="hero-copy"><${motion.div} className="kicker" initial=${{opacity:0,y:15}} animate=${{opacity:1,y:0}}><span>GRUPO 1</span><i></i> EDUCAÇÃO POLÍTICA · HISTÓRIA</${motion.div}><${motion.h1} initial=${{opacity:0,y:26}} animate=${{opacity:1,y:0}} transition=${{delay:.14,duration:.8}}>Quem governa<br/>o <em>Brasil?</em></${motion.h1}><${motion.p} initial=${{opacity:0}} animate=${{opacity:1}} transition=${{delay:.42}}>Uma experiência interativa sobre <strong>Executivo</strong>, <strong>Legislativo</strong> e <strong>Judiciário</strong>, sua evolução histórica e o motivo de o poder não ficar concentrado em uma única instituição.</${motion.p}><${motion.div} className="hero-actions" initial=${{opacity:0,y:16}} animate=${{opacity:1,y:0}} transition=${{delay:.58}}><a className="primary" href="#contexto">Começar seminário <${ArrowDown} size=${17}/></a><button className="secondary" onClick=${start}><${Maximize2} size=${17}/> Modo apresentação</button></${motion.div}><div className="micro"><span><${ShieldCheck}/> Constituição</span><span><${Eye}/> Freios e contrapesos</span><span><${BookOpen}/> História</span></div></div><${motion.div} className="hero-scene" initial=${{opacity:0,scale:.95}} animate=${{opacity:1,scale:1}} transition=${{duration:1,delay:.12}}><${ThreeHero}/><div className="scene-tag t1"><i style=${{background:"#57f2a1"}}></i>Executivo</div><div className="scene-tag t2"><i style=${{background:"#ffd05b"}}></i>Legislativo</div><div className="scene-tag t3"><i style=${{background:"#9f82ff"}}></i>Judiciário</div></${motion.div}></section>
<section id="contexto" className="section"><${Label} n=${1}>O ponto de partida</${Label}><div className="context-grid"><${Reveal} className="context panel"><h2>Três poderes.<br/><span>Um Estado.</span></h2><p>A Constituição de 1988 organiza o Estado brasileiro com três Poderes independentes e harmônicos. Cada um possui funções próprias e, ao mesmo tempo, mecanismos para limitar e fiscalizar os demais.</p><div className="constitution"><b>ART. 2º</b><p>“São Poderes da União, independentes e harmônicos entre si, o Legislativo, o Executivo e o Judiciário.”</p></div></${Reveal}><${Reveal} className="stats panel"><div className="stat big"><strong>3</strong><span>poderes constitucionais</span></div><div className="stat row"><strong>1</strong><span>objetivo central<br/>evitar abuso e concentração</span></div><div className="stat row"><strong>1988</strong><span>Constituição<br/>atualmente em vigor</span></div></${Reveal}></div></section>
<section id="poderes" className="section"><${Label} n=${2}>Conheça cada poder</${Label}><${Reveal} className="title-row"><h2>Quem faz <span>o quê?</span></h2><p>Selecione um poder para abrir sua função, estrutura e exemplos.</p></${Reveal}><div className="powers-layout"><${Reveal} className="power-list">${powers.map((x,i)=>html`<button className=${"power-btn "+(active===i?"active":"")} style=${{"--p":x.color}} onClick=${()=>setActive(i)}><span>${x.n}</span><div><strong>${x.name}</strong><small>${x.role}</small></div><${ChevronRight}/></button>`)}</${Reveal}><${AnimatePresence} mode="wait"><${motion.article} key=${p.id} className="power-detail" style=${{"--p":p.color}} initial=${{opacity:0,x:30,scale:.985}} animate=${{opacity:1,x:0,scale:1}} exit=${{opacity:0,x:-25}}><div className="monogram"><i className="ring"></i><i className="ring r2"></i><i className="ring r3"></i><${IconFor} id=${p.id}/></div><div className="detail"><span className="detail-kicker">${p.n} / ${p.name.toUpperCase()}</span><h3>${p.role}</h3><p>${p.summary}</p><ul>${p.items.map(t=>html`<li><${CheckCircle2}/><span>${t}</span></li>`)}</ul><div className="phrase">${p.phrase}</div></div></${motion.article}></${AnimatePresence}></div></section>
<section id="esferas" className="section"><${Label} n=${3}>Da União ao município</${Label}><${Reveal} className="title-row"><h2>O mesmo sistema,<br/><span>três escalas.</span></h2><p>Veja como os poderes aparecem em diferentes níveis da Federação.</p></${Reveal}><div className="sphere-grid"><${Reveal} className="sphere f"><span>UNIÃO</span><${Crown}/><h3>Brasil</h3><dl><div><dt>Executivo</dt><dd>Presidente da República</dd></div><div><dt>Legislativo</dt><dd>Congresso Nacional: Câmara + Senado</dd></div><div><dt>Judiciário</dt><dd>STF, STJ e Justiça Federal</dd></div></dl></${Reveal}><${Reveal} className="sphere e"><span>ESTADO</span><${Landmark}/><h3>Santa Catarina</h3><dl><div><dt>Executivo</dt><dd>Governador</dd></div><div><dt>Legislativo</dt><dd>Assembleia Legislativa</dd></div><div><dt>Judiciário</dt><dd>Tribunal de Justiça</dd></div></dl></${Reveal}><${Reveal} className="sphere m"><span>MUNICÍPIO</span><${Building2}/><h3>Jaraguá do Sul</h3><dl><div><dt>Executivo</dt><dd>Prefeito</dd></div><div><dt>Legislativo</dt><dd>Câmara de Vereadores</dd></div><div><dt>Judiciário</dt><dd>Não possui Judiciário próprio</dd></div></dl></${Reveal}></div></section>
<section id="equilibrio" className="section"><${Label} n=${4}>Freios e contrapesos</${Label}><div className="checks-grid"><${Reveal} className="checks"><h2>Ninguém manda<br/><span>sozinho.</span></h2><p>Separar poderes não significa isolá-los. Eles se relacionam, fiscalizam e limitam uns aos outros para reduzir o risco de abusos.</p><div className="check-list"><div className="check"><span>01</span><div><h4>Legislativo → Executivo</h4><p>Fiscaliza, aprova orçamento e cria leis.</p></div></div><div className="check"><span>02</span><div><h4>Executivo → Legislativo</h4><p>Pode sancionar ou vetar projetos aprovados.</p></div></div><div className="check"><span>03</span><div><h4>Judiciário → Poder público</h4><p>Pode afastar atos incompatíveis com a Constituição.</p></div></div></div></${Reveal}><${Reveal}><div className="network"><div className="core"><${Balance}/><strong>Equilíbrio</strong><small>freios + contrapesos</small></div><div className="node n1"><${Building2}/><b>Executivo</b></div><div className="node n2"><${Landmark}/><b>Legislativo</b></div><div className="node n3"><${Scale}/><b>Judiciário</b></div><svg className="links" viewBox="0 0 600 470" preserveAspectRatio="none"><path d="M300 90 C230 130 160 215 125 345"/><path d="M300 90 C370 130 440 215 475 345"/><path d="M125 345 C245 405 355 405 475 345"/></svg></div></${Reveal}></div></section>
<section id="historia" className="section"><${Label} n=${5}>Relação histórica</${Label}><${Reveal} className="title-row"><h2>O equilíbrio foi<br/><span>construído no tempo.</span></h2><p>A organização dos poderes mudou junto com os regimes políticos e as Constituições brasileiras.</p></${Reveal}><div className="timeline">${history.map(h=>html`<${Reveal} className="time"><span className="year">${h[0]}</span><h3>${h[1]}</h3><p>${h[2]}</p></${Reveal}>`)}</div></section>
<section id="problema" className="section"><${Label} n=${6}>Questão-problema</${Label}><${Reveal} className="problem"><${CircleHelp} className="help"/><span className="problem-kicker">A pergunta central do trabalho</span><h2>Por que é importante que o poder do Estado <em>não fique concentrado</em> em uma única instituição?</h2><div className="answers"><div className="answer bad"><span>CONCENTRAÇÃO</span><h3>Mais risco</h3><p>Facilita abusos, enfraquece a fiscalização, reduz controles e pode ameaçar direitos e liberdades.</p></div><div className="answer good"><span>SEPARAÇÃO</span><h3>Mais equilíbrio</h3><p>Distribui responsabilidades, cria fiscalização mútua e torna decisões públicas sujeitas a limites constitucionais.</p></div></div><div className="thesis"><${ShieldCheck}/><p><strong>Conclusão:</strong> o Brasil não é governado por uma única pessoa ou instituição. A democracia depende de instituições diferentes, com funções próprias, limites e controles recíprocos.</p></div></${Reveal}></section>
