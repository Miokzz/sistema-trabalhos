<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Envio de Trabalhos - Univille | Prof. Katherine</title>
    
    <!-- Tailwind CSS (Design) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React e ReactDOM (Motor do Site) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel (Para entender o código React no navegador) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Fontes Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            overscroll-behavior-y: none; /* Evita "puxar" a tela no iPhone */
        }
        
        .font-serif-custom {
            font-family: 'Roboto Slab', serif;
        }

        .no-select {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* Animação de tremor (Shake) quando tenta colar */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }
        
        .shake-animation {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
        }

        /* Loading girando */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-custom {
            animation: spin 1s linear infinite;
        }

        /* Ajuste para inputs não darem zoom no iPhone */
        input, textarea {
            font-size: 16px !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Componente para renderizar ícones via CDN
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        const App = () => {
            const [formData, setFormData] = useState({
                nome: '',
                turma: '',
                titulo: '',
                conteudo: ''
            });
            const [wordCount, setWordCount] = useState(0);
            const [pasteAttempts, setPasteAttempts] = useState(0); 
            const [isShake, setIsShake] = useState(false);
            const [alertMessage, setAlertMessage] = useState(null);
            
            // Estados de envio
            const [isSending, setIsSending] = useState(false);
            const [sendSuccess, setSendSuccess] = useState(false);

            // EMAIL CONFIGURADO
            const PROFESSOR_EMAIL = "samucopl@gmail.com";

            // Contador de palavras inteligente
            const countWords = (text) => {
                if (!text) return 0;
                const cleanText = text.replace(/[\.,-\/#!$%\^&\*;:{}=\-_`~()]/g, " ");
                return cleanText.trim().split(/\s+/).filter(word => word.length > 0).length;
            };

            useEffect(() => {
                setWordCount(countWords(formData.conteudo));
            }, [formData.conteudo]);

            const showAlert = (message, type = 'error') => {
                setAlertMessage({ text: message, type });
                setTimeout(() => setAlertMessage(null), 4000);
            };

            const triggerShake = () => {
                setIsShake(true);
                setTimeout(() => setIsShake(false), 400);
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleBlockedAction = (e, action) => {
                e.preventDefault();
                setPasteAttempts(prev => prev + 1);
                triggerShake();
                // Tenta vibrar o celular (feedback tátil)
                if (navigator.vibrate) navigator.vibrate(200);
                showAlert(
                    <span><strong>Ação Bloqueada:</strong> {action} não é permitido. Digite manualmente.</span>,
                    "error"
                );
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSending(true);

                // Relatório de segurança
                const report = `
----------------------------------------
RELATÓRIO DE INTEGRIDADE
----------------------------------------
Tentativas de Colar: ${pasteAttempts} ${pasteAttempts > 0 ? '⚠️(ALERTA)' : '✅'}
Total de Palavras: ${wordCount}
Navegador: ${navigator.userAgent}
                `;

                // Dados para o FormSubmit
                const dataToSend = {
                    _subject: `[TRABALHO] ${formData.titulo} - ${formData.nome}`,
                    _template: "table",
                    _captcha: "false",
                    Nome_Aluno: formData.nome,
                    Turma: formData.turma,
                    Titulo_Trabalho: formData.titulo,
                    Conteudo_Trabalho: formData.conteudo,
                    _Relatorio_Anti_Plagio: report
                };

                try {
                    // Envio silencioso (AJAX)
                    const response = await fetch(`https://formsubmit.co/ajax/${PROFESSOR_EMAIL}`, {
                        method: "POST",
                        headers: { 
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(dataToSend)
                    });

                    if (response.ok) {
                        setSendSuccess(true);
                        showAlert("Trabalho enviado com sucesso para a professora!", "success");
                    } else {
                        throw new Error("Erro no envio");
                    }
                } catch (error) {
                    showAlert("Erro ao conectar com servidor. Tente novamente.", "error");
                    console.error(error);
                } finally {
                    setIsSending(false);
                }
            };

            // Tela de Sucesso
            if (sendSuccess) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-50 font-sans p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl text-center max-w-md w-full border border-green-100">
                            <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6 text-green-600">
                                <Icon name="check" size={40} />
                            </div>
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">Trabalho Entregue!</h2>
                            <p className="text-gray-600 mb-6">
                                Seus dados foram enviados com segurança para a Professora Katherine. Pode fechar esta página.
                            </p>
                            <button 
                                onClick={() => window.location.reload()}
                                className="text-indigo-600 font-semibold hover:underline"
                            >
                                Enviar outro trabalho
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 font-sans text-slate-900">
                    
                    {/* Header */}
                    <header className="bg-[#1e3a8a] text-white shadow-lg no-select sticky top-0 z-30">
                        <div className="max-w-5xl mx-auto px-4 py-4 md:py-6 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="bg-white/10 p-2 rounded-lg text-[#f97316]">
                                    <Icon name="book-open" size={24} />
                                </div>
                                <div>
                                    <h1 className="text-lg md:text-2xl font-bold leading-tight">
                                        Portal de Avaliação
                                    </h1>
                                    <p className="text-xs md:text-sm text-blue-200 opacity-90">
                                        Prof. Katherine • Univille
                                    </p>
                                </div>
                            </div>
                            <div className="hidden sm:block">
                                <span className="text-[10px] uppercase tracking-wider bg-black/20 px-2 py-1 rounded text-blue-100 flex items-center gap-1">
                                    <Icon name="shield" size={10} />
                                    Envio Seguro Automático
                                </span>
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow p-3 md:p-6 lg:p-8">
                        <div className="max-w-4xl mx-auto space-y-6">
                            
                            {/* Passos */}
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 no-select">
                                <div className="bg-white p-3 rounded-lg shadow-sm border border-gray-100 flex items-center gap-3">
                                    <div className="bg-blue-50 p-2 rounded-md text-blue-600">
                                        <Icon name="user" size={18} />
                                    </div>
                                    <span className="text-sm font-semibold text-gray-700">1. Identifique-se</span>
                                </div>
                                <div className="bg-white p-3 rounded-lg shadow-sm border border-gray-100 flex items-center gap-3">
                                    <div className="bg-orange-50 p-2 rounded-md text-orange-600">
                                        <Icon name="edit-3" size={18} />
                                    </div>
                                    <span className="text-sm font-semibold text-gray-700">2. Escreva</span>
                                </div>
                                <div className="bg-white p-3 rounded-lg shadow-sm border border-gray-100 flex items-center gap-3">
                                    <div className="bg-green-50 p-2 rounded-md text-green-600">
                                        <Icon name="mail" size={18} />
                                    </div>
                                    <span className="text-sm font-semibold text-gray-700">3. Enviar (Automático)</span>
                                </div>
                            </div>

                            {/* Formulário Card */}
                            <div className="bg-white rounded-xl shadow-xl border border-gray-200 overflow-hidden">
                                <form onSubmit={handleSubmit} className="flex flex-col">
                                    
                                    {/* Campos de Identificação */}
                                    <div className="p-5 md:p-8 bg-white space-y-5">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                            <div className="space-y-1">
                                                <label className="text-sm font-semibold text-gray-600 flex items-center gap-1">
                                                    <Icon name="user" size={14} />&nbsp;Nome Completo
                                                </label>
                                                <input 
                                                    type="text" 
                                                    name="nome" 
                                                    required
                                                    disabled={isSending}
                                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-[#f97316] focus:ring-1 focus:ring-[#f97316] outline-none transition bg-gray-50 focus:bg-white text-gray-900 disabled:opacity-50"
                                                    placeholder="Seu nome"
                                                    value={formData.nome}
                                                    onChange={handleChange}
                                                />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-sm font-semibold text-gray-600 flex items-center gap-1">
                                                    <Icon name="users" size={14} />&nbsp;Turma
                                                </label>
                                                <input 
                                                    type="text" 
                                                    name="turma" 
                                                    required
                                                    disabled={isSending}
                                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-[#f97316] focus:ring-1 focus:ring-[#f97316] outline-none transition bg-gray-50 focus:bg-white text-gray-900 disabled:opacity-50"
                                                    placeholder="Sua turma"
                                                    value={formData.turma}
                                                    onChange={handleChange}
                                                />
                                            </div>
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-sm font-semibold text-gray-600 flex items-center gap-1">
                                                <Icon name="type" size={14} />&nbsp;Título do Trabalho
                                            </label>
                                            <input 
                                                type="text" 
                                                name="titulo" 
                                                required
                                                disabled={isSending}
                                                className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:border-[#f97316] focus:ring-1 focus:ring-[#f97316] outline-none transition bg-gray-50 focus:bg-white font-medium text-gray-900 disabled:opacity-50"
                                                placeholder="Título do trabalho"
                                                value={formData.titulo}
                                                onChange={handleChange}
                                            />
                                        </div>
                                    </div>

                                    {/* Editor de Texto */}
                                    <div className="bg-gray-50 p-5 md:p-8 border-t border-gray-200">
                                        <div className="flex justify-between items-end mb-2">
                                            <label className="text-sm font-bold text-gray-700">Desenvolvimento</label>
                                            <span className={`text-xs px-2 py-1 rounded-full font-medium ${wordCount === 0 ? 'bg-gray-200 text-gray-600' : 'bg-green-100 text-green-700'}`}>
                                                {wordCount} palavras
                                            </span>
                                        </div>
                                        
                                        <textarea 
                                            name="conteudo"
                                            required
                                            disabled={isSending}
                                            className={`w-full h-[60vh] md:h-96 px-5 py-5 rounded-lg border-2 outline-none transition-all resize-none font-serif-custom text-lg leading-relaxed text-gray-800 placeholder-gray-400 shadow-inner disabled:opacity-50
                                                ${isShake ? 'shake-animation' : 'border-gray-200 focus:border-[#1e3a8a]'}
                                            `}
                                            placeholder="Digite aqui... (Copiar/Colar desativado)"
                                            value={formData.conteudo}
                                            onChange={handleChange}
                                            onPaste={(e) => handleBlockedAction(e, "Colar")}
                                            onCopy={(e) => handleBlockedAction(e, "Copiar")}
                                            onCut={(e) => handleBlockedAction(e, "Recortar")}
                                            onContextMenu={(e) => handleBlockedAction(e, "Menu de Opções")}
                                            spellCheck="false" 
                                        ></textarea>
                                        <p className="text-xs text-center text-gray-400 mt-2 flex items-center justify-center">
                                            <Icon name="shield" size={12} className="inline mr-1"/>
                                            Digitação manual obrigatória. Atividades suspeitas são registradas.
                                        </p>
                                    </div>

                                    {/* Footer com Botão */}
                                    <div className="p-5 md:p-8 bg-white border-t border-gray-200">
                                        <button 
                                            type="submit"
                                            disabled={isSending}
                                            className={`w-full text-white font-bold py-4 px-6 rounded-xl shadow-lg transition-all transform flex items-center justify-center gap-2 text-lg
                                                ${isSending ? 'bg-gray-400 cursor-not-allowed' : 'bg-[#f97316] hover:bg-orange-600 active:bg-orange-700 hover:shadow-xl active:scale-[0.98]'}
                                            `}
                                        >
                                            {isSending ? (
                                                <>
                                                    <Icon name="loader-2" size={24} className="animate-spin-custom" />
                                                    <span>Enviando trabalho...</span>
                                                </>
                                            ) : (
                                                <>
                                                    <Icon name="mail" size={24} />
                                                    <span>Enviar Trabalho Agora</span>
                                                </>
                                            )}
                                        </button>
                                        <p className="text-xs text-gray-400 text-center mt-3 max-w-md mx-auto">
                                            Ao clicar, o trabalho será enviado diretamente para a professora. Não é possível editar após o envio.
                                        </p>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </main>

                    {/* Alerta Toast */}
                    {alertMessage && (
                        <div className={`fixed top-4 left-4 right-4 md:left-auto md:right-8 md:w-96 p-4 rounded-lg shadow-2xl flex items-center gap-3 z-50 animate-bounce-in
                            ${alertMessage.type === 'error' ? 'bg-red-50 text-red-900 border-l-4 border-red-500' : 
                              alertMessage.type === 'warning' ? 'bg-yellow-50 text-yellow-900 border-l-4 border-yellow-500' : 
                              'bg-green-50 text-green-900 border-l-4 border-green-500'}
                        `}>
                            <div className={alertMessage.type === 'error' ? 'text-red-900' : alertMessage.type === 'warning' ? 'text-yellow-900' : 'text-green-900'}>
                                <Icon name={alertMessage.type === 'error' ? 'ban' : alertMessage.type === 'warning' ? 'alert-triangle' : 'check-circle'} size={24} />
                            </div>
                            <div className="flex-1">
                                <p className="font-bold text-sm">{alertMessage.type === 'error' ? 'Ação Bloqueada' : 'Aviso'}</p>
                                <p className="text-sm opacity-90">{alertMessage.text}</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
